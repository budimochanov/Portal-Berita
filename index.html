<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Berita RPL</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="/" class="logo">
      <span class="logo-mark">BR</span>
      <span id="site-name">Portal Berita RPL</span>
    </a>
    <button class="menu-toggle" id="menu-toggle">☰</button>
    <nav class="nav" id="nav">
      <ul id="nav-list"></ul>
    </nav>
  </div>
</header>

<section class="ticker">
  <div class="container ticker-inner">
    <span class="ticker-label">TERKINI</span>
    <div class="ticker-content" id="ticker-content">Memuat berita...</div>
  </div>
</section>

<main class="container main-content">
  <section class="hero">
    <h2 class="section-title">Headline</h2>
    <div class="hero-main" id="hero-main">
      <div class="empty-state">Memuat...</div>
    </div>
  </section>

  <section class="articles-section">
    <h2 class="section-title">Berita Terbaru</h2>
    <div class="articles-grid" id="articles-grid">
      <div class="empty-state">Memuat...</div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p id="footer-text">© 2026 Portal Berita RPL</p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
